<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Quote Generator</title>

<!-- PWA setup -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#37474F">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quotes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
  <span class="status" id="status">Copied</span>
  <div class="mark" aria-hidden="true">&ldquo;</div>
  <blockquote class="quote" id="quoteText"></blockquote>
  <p class="attribution" id="quoteAuthor"></p>
  <hr>
  <div class="controls">
    <button class="stamp-btn" id="newQuoteBtn">New quote</button>
    <div class="secondary-actions">
      <button class="link-btn" id="copyBtn">Copy</button>
      <span aria-hidden="true">&middot;</span>
      <button class="link-btn" id="tweetBtn">Post to X</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    });
  }
</script>
</body>
</html>
